<!-- ═══════════════════════════════════════════════════════════════════════
     SamarthX AI Chat Widget
     Add this to: venv_310/Lib/site-packages/superset/templates/tail_js_custom_extra.html
     (Append AFTER the existing logo replacement script)

     IMPORTANT: Update N8N_WEBHOOK_URL below to your actual n8n webhook URL
     ═══════════════════════════════════════════════════════════════════════ -->

<style>
  #sx-ai-button {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #2563eb;
    color: #fff;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(10, 31, 110, 0.3);
    z-index: 99999;
    transition: transform 0.2s;
  }
  #sx-ai-button:hover { transform: scale(1.08); }

  #sx-ai-panel {
    position: fixed;
    bottom: 96px;
    right: 24px;
    width: 380px;
    max-width: calc(100vw - 48px);
    height: 520px;
    max-height: calc(100vh - 140px);
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(10, 31, 110, 0.25);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 99999;
    font-family: 'DM Sans', sans-serif;
  }
  #sx-ai-panel.open { display: flex; }

  #sx-ai-header {
    background: linear-gradient(135deg, #1a3fbb, #2563eb);
    color: #fff;
    padding: 16px;
    font-weight: 600;
    font-size: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #sx-ai-close { cursor: pointer; font-size: 20px; opacity: 0.8; }
  #sx-ai-close:hover { opacity: 1; }

  #sx-ai-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: #f0f4ff;
  }
  .sx-msg {
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 85%;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .sx-msg.user {
    background: #2563eb;
    color: #fff;
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .sx-msg.bot {
    background: #fff;
    color: #1a3fbb;
    border: 1px solid #d6e0f5;
    border-bottom-left-radius: 4px;
  }
  .sx-msg.loading { color: #888; font-style: italic; }

  #sx-ai-input-row {
    display: flex;
    padding: 12px;
    border-top: 1px solid #e0e7f5;
    background: #fff;
  }
  #sx-ai-input {
    flex: 1;
    border: 1px solid #d6e0f5;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  #sx-ai-input:focus { border-color: #2563eb; }
  #sx-ai-send {
    margin-left: 8px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    cursor: pointer;
    font-weight: 600;
  }
  #sx-ai-send:disabled { background: #93b8f9; cursor: not-allowed; }
</style>

<div id="sx-ai-button" title="Ask AI about your data">💬</div>

<div id="sx-ai-panel">
  <div id="sx-ai-header">
    <span>SamarthX AI Assistant</span>
    <span id="sx-ai-close">&times;</span>
  </div>
  <div id="sx-ai-messages">
    <div class="sx-msg bot">Hi! Ask me anything about your employee or school data. For example: "How many teachers are in Goa?"</div>
  </div>
  <div id="sx-ai-input-row">
    <input id="sx-ai-input" type="text" placeholder="Ask about your data..." />
    <button id="sx-ai-send">Send</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ═══════════════════════════════════════════════════════════
  // UPDATE THIS to your n8n webhook URL
  // Local test:  http://localhost:5678/webhook/ai-chat
  // Production:  https://your-n8n-domain/webhook/ai-chat
  // ═══════════════════════════════════════════════════════════
  const N8N_WEBHOOK_URL = '/api/ai-chat';
  const chatHistory = [];

  function init() {
    // Avoid double initialization if init is retried
    if (window.sx_ai_initialized) return;
    const btn = document.getElementById('sx-ai-button');
    const panel = document.getElementById('sx-ai-panel');
    const close = document.getElementById('sx-ai-close');
    const input = document.getElementById('sx-ai-input');
    const send = document.getElementById('sx-ai-send');
    const messages = document.getElementById('sx-ai-messages');

    if (!btn || !panel) return;
    window.sx_ai_initialized = true;

    btn.addEventListener('click', () => panel.classList.toggle('open'));
    close.addEventListener('click', () => panel.classList.remove('open'));

    function addMessage(text, cls) {
      const div = document.createElement('div');
      div.className = 'sx-msg ' + cls;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    async function ask() {
      const question = input.value.trim();
      if (!question) return;

      addMessage(question, 'user');
      input.value = '';
      send.disabled = true;

      const loading = addMessage('Thinking...', 'bot loading');

      try {
        const res = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: question, history: chatHistory })
        });
        const data = await res.json();
        loading.remove();
        
        const answer = data.answer || 'Sorry, I could not get an answer.';
        addMessage(answer, 'bot');
        
        // Add current turn to history
        chatHistory.push({ role: 'user', content: question });
        chatHistory.push({ role: 'assistant', content: answer });
        
        // Cap history to last 5 turns (10 messages) to prevent token bloat
        if (chatHistory.length > 10) {
          chatHistory.shift();
          chatHistory.shift();
        }
      } catch (err) {
        loading.remove();
        addMessage('Error connecting to AI service. Please try again.', 'bot');
      } finally {
        send.disabled = false;
      }
    }

    send.addEventListener('click', ask);
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') ask(); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  setTimeout(init, 1500);  // retry for React-rendered pages
})();
</script>
